name: Build Android Release (ARM64 Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. קימפול גרסת Release עבור מעבדי 64-ביט
      - name: Build Release APK (ARM64 only)
        run: ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      # 2. יישור (Zipalign) וחתימה מלאה
      - name: Zipalign and Sign APK
        run: |
          # מציאת ה-APK שנוצר
          UNSIGNED_APK=$(find . -name "*.apk" | head -n 1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          
          mkdir -p dist
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          # שלב א': יישור הקובץ (Zipalign)
          echo "Running zipalign..."
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" dist/aligned.apk
          
          # שלב ב': יצירת מפתח חתימה
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass 123456 -keypass 123456 -dname "CN=AutoSub, OU=App, O=AutoSub, C=IL"
          
          # שלב ג': חתימה באמצעות apksigner עם תמיכה בכל סוגי החתימות (V1, V2, V3)
          echo "Signing with apksigner..."
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias my-key --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out dist/AutoSub-arm64-release.apk dist/aligned.apk
          
          # שלב ד': אימות החתימה
          $BUILD_TOOLS/apksigner verify --verbose dist/AutoSub-arm64-release.apk

      # 3. העלאת הקובץ המוכן
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSub-ARM64-Release-APK
          path: dist/AutoSub-arm64-release.apk
