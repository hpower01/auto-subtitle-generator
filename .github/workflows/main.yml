name: Build Android Release (ARM64 Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # קימפול גרסת Release
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # יישור (Zipalign) וחתימה
      - name: Zipalign and Sign APK
        run: |
          mkdir -p dist
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          # 1. איתור ה-APK המדויק מתיקיית ה-Release
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            # במקרה שהמודול לא נקרא 'app'
            UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          fi
          
          echo "Found APK: $UNSIGNED_APK"
          
          # 2. יישור (Zipalign)
          echo "Running zipalign..."
          $BUILD_TOOLS/zipalign -f -v -p 4 "$UNSIGNED_APK" dist/aligned.apk
          
          # 3. יצירת מפתח יציב עם פרמטרים תואמים
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "12345678" \
            -keypass "12345678" \
            -dname "CN=AutoSub, OU=App, O=AutoSub, C=IL"
          
          # 4. חתימה עם apksigner
          echo "Signing APK..."
          $BUILD_TOOLS/apksigner sign \
            --ks release.jks \
            --ks-key-alias my-key-alias \
            --ks-pass pass:12345678 \
            --key-pass pass:12345678 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/AutoSub-release.apk dist/aligned.apk
          
          # 5. אימות החתימה
          $BUILD_TOOLS/apksigner verify --verbose dist/AutoSub-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSub-Release-APK
          path: dist/AutoSub-release.apk
